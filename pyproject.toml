[tool.poetry]
name = "cyber-monitor-backend"
version = "1.0.0"
description = "Cyber Monitor Control Backend"
authors = ["Your Name <your@email.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-dotenv = "^1.0.0"
supabase = "^1.1.1"
PyJWT = "^2.8.0"
websockets = "^12.0"
pydantic = "^2.4.2"
httpx = "^0.25.1"
aiofiles = "^23.2.1"

[tool.poetry.dev-dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
