# render.yaml
services:
  - type: web
    name: worm-c2
    runtime: python
    repo: https://github.com/yourusername/worm-c2  # Replace with your repo
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
